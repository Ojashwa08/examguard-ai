# A generic, single-database configuration.

[alembic]
# Path to migration scripts folder
script_location = alembic

# Template used to generate migration file names
# Valid tokens: year, month, day, hour, minute, second, rev, slug
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# Defaults to the current working directory.
prepend_sys_path = .

# Timezone used when rendering dates in migration files (e.g. UTC)
timezone = UTC

# Max length of characters for "slug" in filenames
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# regardless of whether an autogenerate target is specified.
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a corresponding .py
# file to be treated as revisions.
sourceless = false

# Version location specification; defaults to alembic/versions.
# When using multiple version directories, initial revisions must be created with --version-path
version_locations = %(here)s/alembic/versions

# Version path separator; defaults to os.pathsep.
version_path_separator = os

# Database connection URL
# Note: Overridden in alembic/env.py via environment variables (DATABASE_URL)
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/secure_exam_db

[post_write_hooks]
# Post-write hooks define scripts or Python functions that are run
# on newly generated revision scripts.
#
# Format with black code formatter:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S